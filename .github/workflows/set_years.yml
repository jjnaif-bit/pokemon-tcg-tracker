name: Actualizar años de sets

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

jobs:
  set_years:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PPT_API_KEY: ${{ secrets.PPT_API_KEY }}
        run: python -m src.set_years
