name: Rotar precios sets diario

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

concurrency:
  group: rotar-scraper
  cancel-in-progress: false

jobs:
  rotar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Rotar precios
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PPT_API_KEY: ${{ secrets.PPT_API_KEY }}
        run: python -m src.rotar
