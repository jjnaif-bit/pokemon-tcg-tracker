name: Prueba descubrir sets

on:
  workflow_dispatch:

jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descubrir sets
        env:
          PPT_API_KEY: ${{ secrets.PPT_API_KEY }}
        run: |
          python -c "
          import os, urllib.request, json
          key = os.environ['PPT_API_KEY']
          url = 'https://www.pokemonpricetracker.com/api/v2/cards?setName=Prismatic%20Evolutions&limit=5'
          req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + key})
          d = json.load(urllib.request.urlopen(req, timeout=30))
          data = d.get('data', [])
          print('Cartas devueltas:', len(data))
          print('Metadata:', {k:v for k,v in d.items() if k != 'data'})
          for c in data[:5]:
              print(' -', c.get('name'), '|', c.get('setName'), '|', c.get('cardNumber'))
          "
