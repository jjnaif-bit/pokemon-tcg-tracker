name: Precios gradeados diario

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

concurrency:
  group: graded-scraper
  cancel-in-progress: false

jobs:
  graded:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Correr precios gradeados
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PPT_API_KEY: ${{ secrets.PPT_API_KEY }}
        run: python -m src.graded
