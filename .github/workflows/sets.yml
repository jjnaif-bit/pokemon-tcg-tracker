name: Descargar sets completos

on:
  schedule:
    - cron: "0 16 * * 0"
  workflow_dispatch:

concurrency:
  group: sets-scraper
  cancel-in-progress: false

jobs:
  sets:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Descargar sets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PPT_API_KEY: ${{ secrets.PPT_API_KEY }}
        run: python -m src.sets
