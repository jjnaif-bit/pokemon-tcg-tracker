name: Sembrar sets nuevos (automatico)

on:
  schedule:
    - cron: "0 19 * * 2"
  workflow_dispatch:

concurrency:
  group: sets-scraper
  cancel-in-progress: false

jobs:
  auto:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Sembrar automatico
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PPT_API_KEY: ${{ secrets.PPT_API_KEY }}
        run: python -m src.auto
