name: Prueba campo anio

on:
  workflow_dispatch:

jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guardar campos en tabla
        env:
          PPT_API_KEY: ${{ secrets.PPT_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pip install psycopg2-binary requests -q
          python -c "
          import os, urllib.request, json, psycopg2
          key = os.environ['PPT_API_KEY']
          req = urllib.request.Request('https://www.pokemonpricetracker.com/api/v2/cards?search=charizard&limit=1', headers={'Authorization': 'Bearer ' + key})
          d = json.load(urllib.request.urlopen(req, timeout=30))
          card = d['data'][0] if isinstance(d.get('data'), list) else d.get('data')
          texto = json.dumps(card, indent=2)[:5000]
          c = psycopg2.connect(os.environ['DATABASE_URL'])
          cur = c.cursor()
          cur.execute('CREATE TABLE IF NOT EXISTS prueba_json (id SERIAL PRIMARY KEY, contenido TEXT, creado TIMESTAMPTZ DEFAULT now())')
          cur.execute('INSERT INTO prueba_json (contenido) VALUES (%s)', (texto,))
          c.commit(); c.close()
          print('Guardado en tabla prueba_json')
          "
