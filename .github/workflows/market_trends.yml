name: Cruce mercado + Google Trends Mexico

on:
  schedule:
    - cron: "30 14 * * *"
  workflow_dispatch:

concurrency:
  group: market-trends
  cancel-in-progress: false

jobs:
  market_trends:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Cruce mercado + Google Trends
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.market_trends
