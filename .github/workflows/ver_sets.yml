name: Ver campos de sets (diagnostico)

on:
  workflow_dispatch:

jobs:
  ver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Ver sets
        env:
          PPT_API_KEY: ${{ secrets.PPT_API_KEY }}
        run: python -m src.ver_sets
